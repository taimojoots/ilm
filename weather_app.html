<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tänase Päeva Ilm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .location {
            font-size: 1.2em;
            margin-bottom: 10px;
            opacity: 0.9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .location:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .location-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;
        }

        .dropdown-content.show {
            display: block;
            animation: dropdownOpen 0.3s ease;
        }

        @keyframes dropdownOpen {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .dropdown-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 15px;
            margin: 5px;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .dropdown-item.active {
            background: rgba(255, 255, 255, 0.25);
            font-weight: 500;
        }

        .date {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 30px;
        }

        .weather-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .temperature {
            font-size: 3.5em;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .detail-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.1em;
            font-weight: 500;
        }

        .hourly-forecast {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .hourly-title {
            font-size: 1em;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .hourly-items {
            display: flex;
            justify-content: space-between;
            overflow-x: auto;
            gap: 15px;
        }

        .hourly-item {
            text-align: center;
            min-width: 60px;
        }

        .hourly-time {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .hourly-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .hourly-temp {
            font-size: 0.9em;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="location-dropdown">
            <div class="location" id="location" onclick="toggleDropdown()">
                <span id="currentLocation">Sigula, Kuusalu vald</span>
                <span>📍</span>
            </div>
            <div class="dropdown-content" id="locationDropdown">
                <div class="dropdown-item active" onclick="selectLocation('sigula')">
                    Sigula, Kuusalu vald
                </div>
                <div class="dropdown-item" onclick="selectLocation('tallinn')">
                    Tallinn, Eesti
                </div>
            </div>
        </div>
        <div class="date" id="date"></div>
        
        <div class="weather-icon" id="weatherIcon">☀️</div>
        
        <div class="temperature" id="temperature">18°</div>
        <div class="description" id="description">Päikeseline</div>
        
        <div class="details">
            <div class="detail-item">
                <div class="detail-label">Tuul</div>
                <div class="detail-value" id="wind">12 km/h</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Niiskus</div>
                <div class="detail-value" id="humidity">65%</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Nähtavus</div>
                <div class="detail-value" id="visibility">10 km</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">UV indeks</div>
                <div class="detail-value" id="uv">6</div>
            </div>
        </div>

        <div class="hourly-forecast">
            <div class="hourly-title">Täna tunnipõhiselt</div>
            <div class="hourly-items" id="hourlyForecast">
                <div class="hourly-item">
                    <div class="hourly-time">12:00</div>
                    <div class="hourly-icon">☀️</div>
                    <div class="hourly-temp">18°</div>
                </div>
                <div class="hourly-item">
                    <div class="hourly-time">15:00</div>
                    <div class="hourly-icon">⛅</div>
                    <div class="hourly-temp">20°</div>
                </div>
                <div class="hourly-item">
                    <div class="hourly-time">18:00</div>
                    <div class="hourly-icon">🌤️</div>
                    <div class="hourly-temp">17°</div>
                </div>
                <div class="hourly-item">
                    <div class="hourly-time">21:00</div>
                    <div class="hourly-icon">🌙</div>
                    <div class="hourly-temp">14°</div>
                </div>
            </div>
        </div>

        <button class="refresh-btn" onclick="updateWeather()">🔄 Uuenda</button>
    </div>

    <script>
        // Ilmaandmed erinevatele asukohtadele
        const weatherDataByLocation = {
            sigula: [
                {
                    temp: 16,
                    icon: '🌊',
                    desc: 'Meretuuline',
                    wind: '15 km/h',
                    humidity: '72%',
                    visibility: '12 km',
                    uv: '5'
                },
                {
                    temp: 12,
                    icon: '🌧️',
                    desc: 'Vihmahoog',
                    wind: '22 km/h',
                    humidity: '88%',
                    visibility: '7 km',
                    uv: '2'
                },
                {
                    temp: 19,
                    icon: '⛅',
                    desc: 'Pilves tuulega',
                    wind: '18 km/h',
                    humidity: '65%',
                    visibility: '15 km',
                    uv: '6'
                },
                {
                    temp: 8,
                    icon: '🌨️',
                    desc: 'Lumesadu tuulega',
                    wind: '28 km/h',
                    humidity: '92%',
                    visibility: '4 km',
                    uv: '1'
                }
            ],
            tallinn: [
                {
                    temp: 18,
                    icon: '☀️',
                    desc: 'Päikeseline',
                    wind: '12 km/h',
                    humidity: '62%',
                    visibility: '15 km',
                    uv: '6'
                },
                {
                    temp: 14,
                    icon: '🌦️',
                    desc: 'Hoovihm',
                    wind: '16 km/h',
                    humidity: '78%',
                    visibility: '10 km',
                    uv: '3'
                },
                {
                    temp: 21,
                    icon: '🌤️',
                    desc: 'Osaliselt päikeseline',
                    wind: '10 km/h',
                    humidity: '58%',
                    visibility: '18 km',
                    uv: '7'
                },
                {
                    temp: 6,
                    icon: '❄️',
                    desc: 'Kerge lumesadu',
                    wind: '20 km/h',
                    humidity: '85%',
                    visibility: '8 km',
                    uv: '1'
                }
            ]
        };

        const hourlyDataByLocation = {
            sigula: [
                [
                    { time: '12:00', icon: '🌊', temp: 16 },
                    { time: '15:00', icon: '⛅', temp: 17 },
                    { time: '18:00', icon: '🌤️', temp: 15 },
                    { time: '21:00', icon: '🌙', temp: 13 }
                ],
                [
                    { time: '12:00', icon: '🌧️', temp: 12 },
                    { time: '15:00', icon: '⛈️', temp: 13 },
                    { time: '18:00', icon: '🌧️', temp: 11 },
                    { time: '21:00', icon: '☁️', temp: 10 }
                ],
                [
                    { time: '12:00', icon: '⛅', temp: 19 },
                    { time: '15:00', icon: '🌤️', temp: 20 },
                    { time: '18:00', icon: '⛅', temp: 18 },
                    { time: '21:00', icon: '🌙', temp: 16 }
                ],
                [
                    { time: '12:00', icon: '🌨️', temp: 8 },
                    { time: '15:00', icon: '❄️', temp: 7 },
                    { time: '18:00', icon: '🌨️', temp: 6 },
                    { time: '21:00', icon: '☁️', temp: 5 }
                ]
            ],
            tallinn: [
                [
                    { time: '12:00', icon: '☀️', temp: 18 },
                    { time: '15:00', icon: '☀️', temp: 20 },
                    { time: '18:00', icon: '🌤️', temp: 17 },
                    { time: '21:00', icon: '🌙', temp: 15 }
                ],
                [
                    { time: '12:00', icon: '🌦️', temp: 14 },
                    { time: '15:00', icon: '⛈️', temp: 15 },
                    { time: '18:00', icon: '🌧️', temp: 13 },
                    { time: '21:00', icon: '☁️', temp: 12 }
                ],
                [
                    { time: '12:00', icon: '🌤️', temp: 21 },
                    { time: '15:00', icon: '☀️', temp: 23 },
                    { time: '18:00', icon: '🌤️', temp: 20 },
                    { time: '21:00', icon: '🌙', temp: 18 }
                ],
                [
                    { time: '12:00', icon: '❄️', temp: 6 },
                    { time: '15:00', icon: '🌨️', temp: 5 },
                    { time: '18:00', icon: '❄️', temp: 4 },
                    { time: '21:00', icon: '☁️', temp: 3 }
                ]
            ]
        };

        let currentLocation = 'sigula';
        let currentWeatherIndex = 0;

        function updateDate() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('date').textContent = now.toLocaleDateString('et-EE', options);
        }

        function updateWeather() {
            const weather = weatherData[currentWeatherIndex];
            const hourly = hourlyData[currentWeatherIndex];
            
            document.getElementById('temperature').textContent = weather.temp + '°';
            document.getElementById('weatherIcon').textContent = weather.icon;
            document.getElementById('description').textContent = weather.desc;
            document.getElementById('wind').textContent = weather.wind;
            document.getElementById('humidity').textContent = weather.humidity;
            document.getElementById('visibility').textContent = weather.visibility;
            document.getElementById('uv').textContent = weather.uv;

            // Uuenda tunnipõhist ennustust
            const hourlyContainer = document.getElementById('hourlyForecast');
            hourlyContainer.innerHTML = '';
            
            hourly.forEach(item => {
                const hourlyItem = document.createElement('div');
                hourlyItem.className = 'hourly-item';
                hourlyItem.innerHTML = `
                    <div class="hourly-time">${item.time}</div>
                    <div class="hourly-icon">${item.icon}</div>
                    <div class="hourly-temp">${item.temp}°</div>
                `;
                hourlyContainer.appendChild(hourlyItem);
            });

            // Järgmine ilmaandmete komplekt
            currentWeatherIndex = (currentWeatherIndex + 1) % weatherData.length;
        }

        // Käivita leht
        updateDate();
        updateWeather();

        // Automaatne uuendamine iga 30 sekundi järel (näidiseks)
        setInterval(updateWeather, 30000);
    </script>
</body>
</html>
